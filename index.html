<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dino Runner</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Dino Runner</h1>
      <p class="score">현재 점수 <output id="score">0</output></p>
      <canvas id="game" width="900" height="260" aria-label="공룡 러너 게임" aria-describedby="instructions">
        이 게임을 실행하려면 Canvas를 지원하는 브라우저가 필요합니다.
      </canvas>
      <button id="start-button" type="button">시작</button>
      <p id="instructions">Space · ↑ · 게임 화면 클릭으로 시작하고 점프하세요.<br>게임 오버 후 같은 조작이나 재시작 버튼으로 다시 시작할 수 있습니다.</p>
    </main>
  </body>
</html>
